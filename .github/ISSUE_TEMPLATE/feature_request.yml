name: Feature request
description: Suggest a local-first utility or compatibility improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed local implementation
    validations:
      required: true
  - type: dropdown
    id: pack
    attributes:
      label: Suggested plugin pack
      options:
        - Core
        - Hardware
        - System tools
        - Automation
        - AI workbench
        - Game enhancements
        - New pack
    validations:
      required: true
  - type: textarea
    id: network
    attributes:
      label: Network and privilege requirements
      description: State whether the feature needs Internet, elevation, drivers or hardware writes.
    validations:
      required: true
